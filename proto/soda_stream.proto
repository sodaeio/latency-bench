  RAYDIUM_CPMM          = 1;
  RAYDIUM_LAUNCHPAD     = 2;
  PUMP_FUN              = 3;
  PUMP_AMM              = 4;
  DYNAMIC_BONDING_CURVE = 5;
  DYNAMIC_AMM           = 6;
  DYNAMIC_AMM_V2        = 7;
  HEAVEN_AMM            = 8;
  MASTER_MIND           = 9;
  MOONIT                = 10;
  BAGS                  = 11;
  BONK                  = 12;
  MOONSHOT              = 13;
  BELIEVE               = 14;
  JUPITER_STUDIO        = 15;
  RAYDIUM_CLMM          = 16;
  METEORA_DLMM          = 17;
  BONKERS               = 18;
  MAYHEM                = 19;
  BOOP                  = 20;
  VIRTUALS              = 21;
  WHIRLPOOL             = 22;
  PHOENIX_V1            = 23;
  JUPITER               = 24;
  DRIFT_V2              = 25;
  MARGINFI_V2           = 26;
  KAMINO_LENDING        = 27;
  KAMINO_YVAULTS        = 28;
  JUPITER_DCA           = 29;
  JUPITER_LIMIT_ORDER   = 30;
  JUPITER_PERPS         = 31;
  OBRIC_V2              = 32;
  ZEROFI                = 33;
  SOLFI_V2              = 34;
  TESSERA               = 35;
  GOONFI_V2             = 36;
  HUMIDIFI              = 37;
  ALPHA_Q               = 38;
  BISONFI               = 39;
  STABBLE               = 40;
  METEORA_ALPHA_VAULT   = 41;
  METEORA_ZAP           = 42;
}

enum WalletTag {
  TAG_USER         = 0;
  TAG_DEVELOPER    = 1;
  TAG_BUNDLER      = 2;
  TAG_INSIDER      = 3;
  TAG_SNIPER       = 4;
}
