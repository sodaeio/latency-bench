[package]
name = "latency-bench"
version = "0.2.1"
edition = "2021"
description = "Compare latency across Solana gRPC, shredstream, QUIC, and WebSocket endpoints"
license = "Apache-2.0"

[[bin]]
name = "latency-bench"
path = "src/main.rs"

[[bin]]
name = "meta-verify"
path = "src/bin/meta_verify.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
prost-types = "0.14"
futures = "0.3"
bs58 = "0.5"
bincode = "1.3"
solana-entry = "3.1"
solana-pubkey = "3.0"
# solana-signature 3.4.0 introduced a broken trait bound; pin to last good 3.3.0
solana-signature = "=3.3.0"
anyhow = "1"
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-tungstenite = { version = "0.29.0", features = ["native-tls"] }
serde_json = "1.0.149"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
socket2 = "0.5"
libc = "0.2"

[build-dependencies]
tonic-prost-build = "0.14"
protoc-bin-vendored = "3"
