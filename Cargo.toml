[package]
name = "latency-bench"
version = "0.1.0"
edition = "2021"
description = "Compare latency across Solana gRPC, shredstream, QUIC, and WebSocket endpoints"
license = "Apache-2.0"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
prost-types = "0.14"
futures = "0.3"
bs58 = "0.5"
bincode = "1.3"
solana-entry = "2"
solana-pubkey = "2"
anyhow = "1"
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-tungstenite = { version = "0.29.0", features = ["native-tls"] }
serde_json = "1.0.149"

[build-dependencies]
tonic-prost-build = "0.14"
protoc-bin-vendored = "3"
